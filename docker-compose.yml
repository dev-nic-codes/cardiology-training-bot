services:
  cardiology-training-bot:
    build: .
    container_name: cardiology-training-bot
    restart: unless-stopped
    command: ["/bin/sh", "-c", "umask 077 && exec python main.py"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if b'main.py' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
